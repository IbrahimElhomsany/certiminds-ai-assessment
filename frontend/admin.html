<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>/* apply the saved day/night theme before the page paints */
try { if (localStorage.getItem("nova_admin_theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
<title>Nova Studio | Ceramica Nova admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Day theme = the shop's look (white, black type and buttons, light grey surfaces, one blue accent).
     Night theme via the moon button; the choice is remembered in this browser. */
  :root { --bg:#f7f7f8; --panel:#fff; --panel2:#f3f3f4; --line:#e7e7e7; --text:#1f2328; --ink:#111; --muted:#6b7280;
          --accent:#3d6fd8; --accent-soft:#eef3fd; --ok:#2fa865; --ok-soft:#e8f6ee; --ok-ink:#fff;
          --warn:#c27a00; --warn-soft:#fff3dd; --bad:#c0392b; --bad-soft:#fdecea; --profit:#2fa865;
          --btn:#111; --btn-text:#fff; --side:#fff; --nav-on:#f1f1f2; --tipbg:#fff; --shadow:0 1px 2px rgba(0,0,0,.04);
          --grid:#ececee; --axis:#8a8f98; color-scheme:light;
          /* chart series: 4 categorical slots (checked for colour-blind separation) + revenue / gross profit */
          --c1:#1f9d63; --c2:#3d6fd8; --c3:#c98a12; --c4:#8b5cf6; --c5:#157a4b; --rev:#1f9d63; --gp:#c98a12; }
  :root[data-theme="dark"] { /* night = deep green, like the Nova Studio mockup */
          --bg:#0a1713; --panel:#10221d; --panel2:#152c26; --line:#1f3a32; --text:#e3eee9; --ink:#f2f8f5;
          --muted:#8fa89f; --accent:#4fc1d6; --accent-soft:rgba(79,193,214,.13); --ok:#3ecf8e; --ok-soft:rgba(62,207,142,.13);
          --ok-ink:#06281a; --warn:#f0b44c; --warn-soft:rgba(240,180,76,.13); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.13);
          --profit:#3ecf8e; --btn:#1f9d63; --btn-text:#fff; --side:#0c1c17; --nav-on:rgba(62,207,142,.14); --tipbg:#081310;
          --shadow:0 8px 24px rgba(0,0,0,.25); --grid:#1f3a32; --axis:#8fa89f; color-scheme:dark;
          --c1:#20a06b; --c2:#4a8cf0; --c3:#b8801c; --c4:#8f72ee; --c5:#178a5a; --rev:#3ecf8e; --gp:#e0a63a; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:13.5px/1.5 "Poppins", -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color:inherit; text-decoration:none; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .muted { color:var(--muted); } .small { font-size:12px; } .right { text-align:right; } .nowrap { white-space:nowrap; }
  .num { font-variant-numeric:tabular-nums; }
  h1 { font-size:20px; margin:0; font-weight:600; } h2 { font-size:14.5px; margin:0; font-weight:600; }
  h3 { font-size:13px; margin:0 0 6px; font-weight:600; }

  .btn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--btn); background:var(--btn);
         color:var(--btn-text); border-radius:9px; padding:8px 14px; font-weight:500; font-size:13px; }
  .btn.ghost { background:transparent; color:var(--text); border-color:var(--line); }
  .btn.ghost:hover { border-color:var(--muted); }
  .btn.danger { background:transparent; color:var(--bad); border-color:var(--bad); }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:var(--ok-ink); }
  .btn.sm { padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn:disabled { opacity:.45; cursor:default; }
  input, select, textarea { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 11px; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  label.f { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  label.f + input, label.f + select, label.f + textarea { width:100%; }

  .tag { display:inline-block; white-space:nowrap; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;
         background:var(--panel2); color:var(--muted); }
  .tag.ok, .tag.won, .tag.delivered, .tag.accepted, .tag.approved, .tag.auto_approved { background:var(--ok-soft); color:var(--ok); }
  .tag.low, .tag.pending, .tag.negotiation, .tag.draft { background:var(--warn-soft); color:var(--warn); }
  .tag.out, .tag.critical, .tag.lost, .tag.rejected, .tag.cancelled, .tag.expired { background:var(--bad-soft); color:var(--bad); }
  .tag.quote_sent, .tag.sent, .tag.confirmed, .tag.qualified { background:var(--accent-soft); color:var(--accent); }
  .tag.demo { background:var(--warn-soft); color:var(--warn); }

  /* layout */
  .app { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  aside { background:var(--side); border-right:1px solid var(--line); padding:18px 14px; position:sticky; top:0; height:100vh;
          display:flex; flex-direction:column; gap:4px; }
  .brand { display:flex; gap:10px; align-items:center; padding:2px 8px 18px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--ink); color:var(--panel);
                 display:grid; place-items:center; font-weight:700; }
  .brand b { display:block; font-size:15px; } .brand small { color:var(--muted); font-size:11px; }
  nav a { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; color:var(--muted); font-weight:500; }
  nav a:hover { background:var(--panel2); color:var(--text); }
  nav a.on { background:var(--nav-on); color:var(--ink); font-weight:600; }
  nav a .count { margin-left:auto; background:var(--warn); color:#fff; font-size:10.5px; font-weight:700; border-radius:9px; padding:0 7px; }
  /* showroom photo panel (bottom of the menu, and the login page); picture comes from /admin/showroom.jpg */
  .showcase { margin-top:auto; position:relative; border-radius:14px; overflow:hidden; min-height:190px; display:flex; align-items:flex-end;
              background:var(--panel2) center/cover no-repeat; color:#fff; }
  .showcase::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(6,22,17,.88) 100%); }
  .showcase div { position:relative; padding:14px; } .showcase b { display:block; font-size:15px; line-height:1.25; }
  .showcase span { font-size:12px; opacity:.85; line-height:1.35; display:block; margin-top:4px; }
  .prof { position:relative; }
  .prof-btn { display:flex; align-items:center; gap:9px; background:none; border:1px solid transparent; border-radius:12px; padding:3px 8px 3px 3px; text-align:left; }
  .prof-btn:hover, .prof.open .prof-btn { border-color:var(--line); background:var(--panel); }
  .prof-btn .av { width:34px; height:34px; } .prof-txt b { display:block; font-size:13px; line-height:1.2; } .prof-txt small { color:var(--muted); font-size:11.5px; }
  .chev-d { width:16px; height:16px; color:var(--muted); }
  .prof-menu { display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:40; min-width:220px; background:var(--panel); border:1px solid var(--line);
               border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.18); padding:6px; }
  .prof.open .prof-menu { display:block; }
  .prof-head { display:flex; flex-direction:column; padding:8px 10px 10px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .prof-menu button { display:flex; gap:9px; align-items:center; width:100%; background:none; border:0; border-radius:8px; padding:8px 10px; color:var(--text); }
  .prof-menu button:hover { background:var(--panel2); }
  @media (max-width:900px) { .prof-txt, .chev-d { display:none; } }
  /* in the menu the photo has no frame: it runs edge to edge and fades into the menu at the top and bottom */
  aside .showcase { margin:auto -14px -18px; border-radius:0; min-height:0; aspect-ratio:464 / 574; max-height:300px; background-position:center top; }
  aside .showcase::before { background:linear-gradient(180deg, var(--side) 0%, color-mix(in srgb, var(--side) 55%, transparent) 14%, transparent 38%, transparent 58%, color-mix(in srgb, var(--side) 60%, transparent) 82%, var(--side) 100%); }
  .login-photo { display:none; }
  @media (min-width:980px) {
    .login.split { grid-template-columns:1.1fr 1fr; place-items:stretch; padding:0; }
    .login.split .login-photo { display:flex; min-height:100vh; border-radius:0; }
    .login.split .login-photo div { padding:48px; max-width:520px; } .login.split .login-photo b { font-size:30px; } .login.split .login-photo span { font-size:15px; }
    .login.split .login-form { display:grid; place-items:center; padding:20px; }
  }
  @media (max-height:700px) { aside .showcase { display:none; } }
  /* modern / neon touch, kept light: soft gradients in day mode, a faint green glow in night mode */
  .cv { background-image:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 60%); }
  .copilot { position:relative; overflow:hidden; }
  .copilot::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, var(--c1), var(--c2), var(--c4)); opacity:.8; }
  :root[data-theme="dark"] body { background:
      radial-gradient(900px 500px at 85% -10%, rgba(52,200,138,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(79,193,214,.07), transparent 60%), var(--bg); background-attachment:fixed; }
  :root[data-theme="dark"] .card { border-color:rgba(62,207,142,.16);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.28); }
  :root[data-theme="dark"] nav a.on { box-shadow:inset 0 0 0 1px rgba(62,207,142,.45), 0 0 14px rgba(62,207,142,.18); }
  :root[data-theme="dark"] .seg button.on, :root[data-theme="dark"] .tabs button.on { box-shadow:0 0 0 1px rgba(62,207,142,.5), 0 0 10px rgba(62,207,142,.2); }
  :root[data-theme="dark"] .kico, :root[data-theme="dark"] .cico { box-shadow:0 0 14px color-mix(in srgb, currentColor 22%, transparent); }
  :root[data-theme="dark"] .ln-rev { filter:drop-shadow(0 0 5px rgba(62,207,142,.6)); }
  :root[data-theme="dark"] .ln-gp { filter:drop-shadow(0 0 5px rgba(224,166,58,.5)); }
  :root[data-theme="dark"] .donut { filter:drop-shadow(0 0 6px rgba(62,207,142,.25)); }
  :root[data-theme="dark"] #chart circle { filter:drop-shadow(0 0 5px rgba(255,255,255,.35)); }
  :root[data-theme="dark"] .cv { box-shadow:inset 0 0 18px rgba(255,255,255,.08); }
  :root[data-theme="dark"] .quick a:hover, :root[data-theme="dark"] .crow:hover { border-color:rgba(62,207,142,.5); box-shadow:0 0 12px rgba(62,207,142,.15); }

  .quick a, .crow { transition:border-color .15s, box-shadow .15s; }
  main { padding:22px 28px 60px; min-width:0; }
  .top { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .top .grow { flex:1; }
  .seg { display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px; }
  .seg button { background:none; border:0; padding:5px 12px; border-radius:7px; color:var(--muted); font-size:12.5px; }
  .seg button.on { background:var(--panel2); color:var(--text); }
  .menu-btn { display:none; }
  .theme-btn { width:34px; height:34px; display:inline-grid; place-items:center; border-radius:9px; border:1px solid var(--line);
               background:var(--panel); color:var(--text); padding:0; }
  .theme-btn:hover { border-color:var(--muted); }

  .card { background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:14px; padding:16px 18px; min-width:0; }
  .card .head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .card .head .grow { flex:1; }
  .grid { display:grid; gap:14px; }
  .kpis { grid-template-columns:repeat(5, 1fr); }
  .kpi { display:flex; gap:12px; align-items:center; padding:14px 16px; }
  .kico { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:none; }
  .kico .ico { width:22px; height:22px; }
  .t1 { background:color-mix(in srgb, var(--c1) 14%, transparent); color:var(--c1); }
  .t2 { background:color-mix(in srgb, var(--c2) 14%, transparent); color:var(--c2); }
  .t3 { background:color-mix(in srgb, var(--c3) 16%, transparent); color:var(--c3); }
  .t4 { background:color-mix(in srgb, var(--c4) 14%, transparent); color:var(--c4); }
  .kbody { min-width:0; } .kpi .label { color:var(--muted); font-size:12px; }
  .kval .delta { display:block; }
  .kpi .value { font-size:21px; font-weight:600; }
  .delta { font-size:12px; font-weight:500; } .delta.up { color:var(--ok); } .delta.down { color:var(--bad); }
  .info { width:15px; height:15px; border-radius:50%; border:1px solid var(--muted); font-size:10px; display:inline-grid;
          place-items:center; cursor:help; color:var(--muted); flex:none; }
  .row2 { grid-template-columns:2fr 1fr; } .row3 { grid-template-columns:1fr 1fr 1fr; } .row2e { grid-template-columns:1fr 1fr; }
  .dash-a { grid-template-columns:1.15fr 1.6fr 1fr; margin-top:14px; } .dash-b { grid-template-columns:1.4fr 1fr 1fr .85fr; margin-top:14px; }
  .rulebadge { font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px; cursor:help; white-space:nowrap; }

  /* copilot */
  .clist { display:flex; flex-direction:column; gap:8px; }
  .crow { display:flex; gap:10px; align-items:flex-start; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:9px 10px; }
  .crow .grow { flex:1; min-width:0; } .crow b { display:block; font-size:12.5px; line-height:1.35; } .crow .small { display:block; line-height:1.35; }
  .cact { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; }
  .cact .why { display:inline-flex; gap:5px; align-items:center; font-size:11px; color:var(--muted); cursor:help; }
  .crow .btn { white-space:nowrap; } .crow .btn .ico { width:14px; height:14px; }
  .cico { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none; }
  .cico.follow_up { background:color-mix(in srgb, var(--c2) 14%, transparent); color:var(--c2); }
  .cico.approve { background:color-mix(in srgb, var(--c3) 16%, transparent); color:var(--c3); }
  .cico.restock, .cico.confirm { background:color-mix(in srgb, var(--c4) 14%, transparent); color:var(--c4); }
  .cico.trend, .cico.bot { background:color-mix(in srgb, var(--c1) 14%, transparent); color:var(--c1); }

  /* chart */
  .chart svg { width:100%; height:auto; display:block; }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .ctot { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:6px; } .ctot b { color:var(--text); font-weight:600; }
  .tip { position:absolute; pointer-events:none; background:var(--tipbg); box-shadow:0 4px 14px rgba(0,0,0,.12); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12px; display:none; z-index:5; }

  /* project donut */
  .snap { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .donut-wrap { position:relative; width:160px; height:160px; } .donut { width:100%; height:100%; }
  .donut-mid { position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
  .donut-mid b { font-size:26px; line-height:1; } .donut-mid span { font-size:11px; color:var(--muted); }
  .dlegend { width:100%; display:flex; flex-direction:column; gap:2px; }
  .dlegend div { display:flex; align-items:center; gap:8px; padding:5px 2px; border-bottom:1px solid var(--line); font-size:12.5px; cursor:help; }
  .dlegend div:last-child { border-bottom:0; } .dlegend span { flex:1; } .dlegend i { width:10px; height:10px; border-radius:50%; flex:none; }

  /* pipeline chevrons */
  .pipeline-card { margin-top:14px; }
  .pipe { display:flex; gap:14px; align-items:stretch; }
  .chev { flex:1; display:flex; min-width:0; }
  .cv { flex:1; min-width:0; color:#fff; padding:10px 8px 10px 26px; margin-right:-10px; text-align:center; cursor:help;
        clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 16px 50%); }
  .cv:first-child { clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); padding-left:14px; border-radius:10px 0 0 10px; }
  .cv span { display:block; font-size:11.5px; opacity:.92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cv b { display:block; font-size:21px; line-height:1.2; }
  .cv.s0 { background:var(--c1); } .cv.s1 { background:var(--c2); } .cv.s2 { background:var(--c4); } .cv.s3 { background:var(--c3); } .cv.s4 { background:var(--c5); }
  .pval { flex:none; min-width:170px; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:8px 14px; display:flex; flex-direction:column; justify-content:center; }
  .pval span { font-size:11.5px; color:var(--muted); } .pval b { font-size:19px; }

  /* tabs, lists, quick actions */
  .tabs { display:flex; gap:4px; margin:-4px 0 8px; flex-wrap:wrap; }
  .tabs button { background:none; border:1px solid transparent; border-radius:20px; padding:4px 10px; font-size:12px; white-space:nowrap; color:var(--muted); }
  .tabs button.on { background:var(--nav-on); border-color:var(--line); color:var(--ink); font-weight:600; }
  .tabs .cnt { background:var(--warn); color:#fff; border-radius:9px; font-size:10px; font-weight:700; padding:0 6px; }
  .av { width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:11px; font-weight:600;
        background:color-mix(in srgb, var(--c2) 14%, transparent); color:var(--c2); }
  .thumb.lg { width:44px; height:44px; border-radius:9px; }
  .sico { width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center; }
  .sico .ico { width:16px; height:16px; }
  .sico.ok { background:var(--ok-soft); color:var(--ok); } .sico.low { background:var(--warn-soft); color:var(--warn); }
  .sico.critical, .sico.out { background:var(--bad-soft); color:var(--bad); }
  .st-low { color:var(--warn); } .st-critical, .st-out { color:var(--bad); }
  .foot { display:flex; justify-content:center; align-items:center; gap:6px; margin-top:8px; font-size:12.5px; color:var(--accent); }
  .foot .ico { width:14px; height:14px; }
  .quick { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .quick a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; min-height:74px;
             background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:10px 6px; font-size:12px; font-weight:500; }
  .quick a:hover { border-color:var(--c1); color:var(--ink); } .quick .ico { width:21px; height:21px; color:var(--c1); }
  .head .ico { width:14px; height:14px; vertical-align:-2px; }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:11.5px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--panel2); }
  .tablewrap { overflow-x:auto; }
  .thumb { width:34px; height:34px; border-radius:7px; object-fit:cover; background:var(--panel2); flex:none; }
  .pcell { display:flex; gap:10px; align-items:center; }

  .list .it { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .list .it:last-child { border-bottom:0; } .list .it .grow { flex:1; min-width:0; }
  .ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meter { height:6px; border-radius:4px; background:var(--panel2); overflow:hidden; margin-top:4px; }
  .meter i { display:block; height:100%; }


  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:12px; color:var(--muted); }
  .chip.on { border-color:var(--accent); color:var(--text); background:var(--accent-soft); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; font-size:12px; color:var(--muted); }
  .lnk { color:var(--accent); } .lnk:hover { text-decoration:underline; }
  .back { color:var(--muted); font-size:12.5px; display:inline-flex; gap:6px; align-items:center; margin-bottom:10px; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; font-size:12.5px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .timeline .t { display:grid; grid-template-columns:14px 1fr; gap:10px; padding:6px 0; }

/* Menu photo: /admin/showroom.jpg (images/room_living.jpg, the sofa scene from the design mockup). Login page: the full showroom_lounge.jpg. */
function paintShowcase() {
  document.querySelectorAll(".showcase").forEach(el => el.style.backgroundImage =
    el.classList.contains("login-photo") ? 'url("/images/showroom_lounge.jpg")' : 'url("/admin/showroom.jpg")');
}
const showcase = (cls = "", text = true) => `<div class="showcase ${cls}" role="img" aria-label="A tile showroom lounge with marble wall tiles">${text ? `<div>
  <b>AI-powered tile retail platform</b><span>From first inquiry to repeat business</span></div>` : ""}</div>`;

let S = { token: null, me: null, can: new Set(), days: 30, trail: [], titles: {} };
try { S.token = sessionStorage.getItem("nova_admin_token"); S.days = +sessionStorage.getItem("nova_admin_days") || 30; } catch (e) {}

async function api(path, opts = {}) {
  const r = await fetch("/api/admin" + path, {method: opts.method || "GET",
    headers: {"Content-Type": "application/json", ...(S.token ? {Authorization: "Bearer " + S.token} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status === 401 && path !== "/login") { logout(); throw new Error("Please log in again."); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = data.detail;
    // {field, message}: the screen shows it next to that box. A list comes from the server's own form checks.
    const err = new Error(d && d.message ? d.message : Array.isArray(d) ? d.map(x => x.msg.replace(/^Value error, /, "")).join(", ")
      : typeof d === "string" ? d : r.status >= 500 ? "The server had a problem with this. Please try again in a minute." : `The server said no (${r.status}).`);
    err.field = d && d.field ? d.field : Array.isArray(d) && d[0] && d[0].loc ? String(d[0].loc[d[0].loc.length - 1]) : null;
    throw err;
  }
  return data;
}

function toast(msg, kind = "ok") {
  const t = $("#toast"); t.textContent = msg; t.className = "toast " + kind; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3800);
}

/* A small form dialog. fields: [{name, label, type, options, value, required, hint, min, max, check(v, all)}].
   Every box is checked at once and each problem is shown in red under its own box (Ibrahim's form rule).
   submit(values), when given, runs before the dialog closes: if the server says no about one box
   (error.field), that box turns red and the dialog stays open. Resolves with submit's result (or the values), or null. */
function ask(title, fields, okText = "Save", note = "", submit = null) {
  return new Promise(resolve => {
    const f = $("#dlgForm");
    f.noValidate = true;
    f.innerHTML = `<h2>${esc(title)}</h2>${note ? `<p class="muted small" style="margin:6px 0 0">${note}</p>` : ""}` +
      `<div class="field-err" id="fe__form" style="margin-top:8px"></div>` +
      fields.map(x => `<label class="f" for="fx_${x.name}">${esc(x.label)}${x.required ? "" : x.type === "checkbox" ? "" : ' <span class="muted">(optional)</span>'}</label>` + (
        x.type === "select" ? `<select id="fx_${x.name}" name="${x.name}">${x.options.map(o =>
          `<option value="${esc(o[0])}" ${String(o[0]) === String(x.value ?? "") ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`
        : x.type === "textarea" ? `<textarea id="fx_${x.name}" name="${x.name}" rows="3" maxlength="${x.max || 300}">${esc(x.value || "")}</textarea>`
        : x.type === "checkbox" ? `<label class="small"><input type="checkbox" id="fx_${x.name}" name="${x.name}" ${x.value ? "checked" : ""}> ${esc(x.hint || "")}</label>`
        : `<input id="fx_${x.name}" name="${x.name}" type="${x.type || "text"}" step="any" value="${esc(x.value ?? "")}" ${x.min != null ? `min="${x.min}"` : ""} ${x.max != null ? `max="${x.max}"` : ""} ${x.auto ? `autocomplete="${x.auto}"` : ""}>`)
        + `<div class="field-err" id="fe_${x.name}"></div>`
        + (x.hint && x.type !== "checkbox" ? `<div class="muted small" style="margin-top:3px">${esc(x.hint)}</div>` : "")).join("") +
      `<div class="actions" style="justify-content:flex-end;margin-top:18px">
         <button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok" id="dlgOk">${esc(okText)}</button></div>`;
    const d = $("#dlg");
    const values = () => { const out = {}; fields.forEach(x => { const el = $("#fx_" + x.name); out[x.name] = x.type === "checkbox" ? el.checked : el.value.trim(); }); return out; };
    const mark = (name, msg) => {
      const el = $("#fx_" + name), e = $("#fe_" + name) || $("#fe__form");
      if (el && el.type !== "checkbox") el.classList.toggle("is-bad", !!msg);
      e.textContent = msg || "";
    };
    fields.forEach(x => $("#fx_" + x.name).addEventListener("input", () => { mark(x.name, ""); mark("_form", ""); }));
    let result;
    f.onsubmit = async e => {
      if (!e.submitter || e.submitter.value !== "ok") return;          // Cancel closes as usual
      e.preventDefault();
      const v = values();
      let bad = false;
      for (const x of fields) {
        let msg = "";
        const val = v[x.name];
        if (x.required && x.type !== "checkbox" && val === "") msg = x.type === "select" ? "Please choose one." : "Please fill this in.";
        else if (x.required && x.type === "checkbox" && !val) msg = "Please tick this to go on.";
        else if (x.type === "number" && val !== "" && isNaN(+val)) msg = "Please enter a number.";
        else if (x.type === "number" && val !== "" && x.min != null && +val < x.min) msg = `At least ${x.min}.`;
        else if (x.type === "number" && val !== "" && x.max != null && +val > x.max) msg = `At most ${x.max}.`;
        else if (x.check && val !== "") msg = x.check(val, v) || "";
        mark(x.name, msg); if (msg) bad = true;
      }
      if (bad) { const first = f.querySelector(".is-bad"); if (first) first.focus(); return; }
      if (!submit) { result = v; return d.close("ok"); }
      const ok = $("#dlgOk"); ok.disabled = true; ok.textContent = "Saving…";
      try { result = await submit(v); d.close("ok"); }
      catch (err) {
        const known = err.field && fields.some(x => x.name === err.field);
        mark(known ? err.field : "_form", err.message);
        ok.disabled = false; ok.textContent = okText;
      }
    };
    d.onclose = () => resolve(d.returnValue === "ok" ? result : null);
    d.returnValue = ""; d.showModal();
  });
}

async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); route(); return r; }
  catch (e) { toast(e.message, "bad"); }
}

const DEMO = [["owner","Owner","Everything, incl. prices"],["manager","Sara Haddad","Sales manager, approvals"],

function loginView(msg = "") {

    <form id="lf">
      <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%;justify-content:center;margin-top:16px">Log in</button>
    </form>
    <div class="notice warn small" style="margin-top:16px"><b>Demo company.</b> All customers, leads and sales are generated demo data.
      Password for every demo account: <b>NovaDemo2026!</b></div>
    <div class="demo-users">${DEMO.map(d => `<button type="button" data-u="${d[0]}"><b>${esc(d[1])}</b><span class="muted">${esc(d[2])}</span></button>`).join("")}</div>
  </div></div></div>`;
  paintShowcase();
  document.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { $("#em").value = b.dataset.u + "@ceramicanova.demo"; $("#pw").focus(); });
  $("#lf").onsubmit = async e => {

/* The chart is drawn at the card's real pixel size (text stays 11px), and again when the window is resized. */
function drawChart(rows) {
  const box = $("#chartbox"); if (!box) return;
  const card = box.closest(".card"), head = card.querySelector(".head");
  box.innerHTML = "";
  CH.w = Math.max(300, box.clientWidth);
  CH.h = Math.max(220, Math.min(380, card.clientHeight - head.offsetHeight - 70));
  /* Daily sales jump around a lot (a few big orders), so 30/90-day views draw a 7-day average; the tooltip shows both. */
  const smooth = rows.length > 14, avg = (i, k) => { const w = rows.slice(Math.max(0, i - 6), i + 1); return w.reduce((a, r) => a + r[k], 0) / w.length; };
  const pts = rows.map((r, i) => ({...r, rv: smooth ? avg(i, "revenue") : r.revenue, gv: smooth ? avg(i, "gross_profit") : r.gross_profit, smooth}));
  $("#chartnote").textContent = smooth ? "7-day average per day" : "Per day";
  box.innerHTML = chartSvg(pts);
  bindChart(pts);
  clearTimeout(drawChart.t);
  window.onresize = () => { clearTimeout(drawChart.t); drawChart.t = setTimeout(() => $("#chartbox") && drawChart(rows), 150); };
}
const PROJECT_TIP = {design: "New or qualified leads, still choosing tiles.", quoted: "Quotation sent or negotiating.",
                     in_progress: "Order placed, not delivered yet.", completed: "Delivered in this period (not counted as active)."};
/* Ring chart, one segment per group, 2px gaps between segments. */
function donutSvg(groups) {
  const total = groups.reduce((a, x) => a + x.count, 0) || 1, R = 52, C = 2 * Math.PI * R, gap = groups.filter(x => x.count).length > 1 ? 3 : 0;
  let off = 0;
  const segs = groups.map((x, i) => {
    const len = x.count / total * C, s = `<circle r="${R}" cx="64" cy="64" fill="none" style="stroke:var(--c${i + 1})" stroke-width="14"
      stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"><title>${esc(x.label)}: ${num(x.count)}</title></circle>`;
    off += len; return x.count ? s : "";
  }).join("");
  return `<svg viewBox="0 0 128 128" class="donut" role="img" aria-label="Projects by stage">${segs}</svg>`;
}
function cardLink(a) {
  if (a.view === "followups") return S.can.has("quotes.edit") ? "#/followups" : "#/leads?stalled=1";
  if (a.view === "leads" && a.filter === "stalled") return "#/leads?stalled=1";
  if (a.view === "orders" && a.filter) return "#/orders?status=" + a.filter;
  if (a.view === "inventory" && a.sku) return "#/inventory/" + a.sku;
  return "#/" + a.view;
}

/* Revenue + gross profit, one point per day, inline SVG (one axis, both in QAR). */
const CH = {w: 760, h: 250, l: 44, r: 86, t: 14, b: 26};
function chartSvg(rows) {
  if (!rows.length) return `<div class="empty">No data</div>`;
  const max = Math.max(1, ...rows.map(r => r.rv));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const x = i => CH.l + (rows.length === 1 ? 0 : i * (CH.w - CH.l - CH.r) / (rows.length - 1));
  const y = v => CH.t + (1 - v / top) * (CH.h - CH.t - CH.b);
  const line = key => rows.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join("");
  const area = key => `${line(key)}L${x(rows.length - 1)},${y(0)}L${x(0)},${y(0)}Z`;
  let grid = "";
  for (let v = 0; v <= top; v += step)
    grid += `<line x1="${CH.l}" x2="${CH.w - CH.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)"/><text x="${CH.l - 8}" y="${y(v) + 4}" style="fill:var(--axis)" font-size="11" text-anchor="end">${v >= 1000 ? (v / 1000) + "k" : v}</text>`;
  const every = Math.ceil(rows.length / Math.max(3, Math.floor((CH.w - CH.l - CH.r) / 70)));
  const xl = rows.map((r, i) => i % every === 0 ? `<text x="${x(i)}" y="${CH.h - 6}" style="fill:var(--axis)" font-size="11" text-anchor="middle">${date(r.date)}</text>` : "").join("");
  /* Last day's values as labels at the end of each line; period totals go under the chart. */
  const tot = key => rows.reduce((a, r) => a + r[key], 0);
  const last = rows.length - 1, lx = x(last);
  let ry = y(rows[last].rv), gy = y(rows[last].gv);
  if (Math.abs(ry - gy) < 24) { const m = (ry + gy) / 2; ry = m - 12; gy = m + 12; }
  const pill = (yy, key, v) => `<g transform="translate(${lx + 10},${Math.max(CH.t + 10, Math.min(CH.h - CH.b - 10, yy))})">
      <rect x="0" y="-10" width="72" height="20" rx="6" style="fill:var(--panel);stroke:var(--${key})"/>
      <text x="36" y="4" font-size="10.5" text-anchor="middle" style="fill:var(--text)" font-weight="600">${v >= 1000 ? (v / 1000).toFixed(v >= 100000 ? 0 : 1) + "k" : Math.round(v)}</text></g>`;
  return `<svg id="chart" viewBox="0 0 ${CH.w} ${CH.h}" role="img" aria-label="Daily revenue and gross profit">
    <defs>${["rev", "gp"].map(k => `<linearGradient id="g_${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--${k})" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--${k})" stop-opacity="0"/></linearGradient>`).join("")}</defs>
    ${grid}${xl}<path d="${area("rv")}" fill="url(#g_rev)"/><path d="${area("gv")}" fill="url(#g_gp)"/>
    <path class="ln-rev" d="${line("rv")}" fill="none" style="stroke:var(--rev)" stroke-width="2" stroke-linejoin="round"/>
    <path class="ln-gp" d="${line("gv")}" fill="none" style="stroke:var(--gp)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${y(rows[last].rv)}" r="4" style="fill:var(--rev);stroke:var(--panel)" stroke-width="2"/>
    <circle cx="${lx}" cy="${y(rows[last].gv)}" r="4" style="fill:var(--gp);stroke:var(--panel)" stroke-width="2"/>
    ${pill(ry, "rev", rows[last].rv)}${pill(gy, "gp", rows[last].gv)}
    <line id="hair" y1="${CH.t}" y2="${CH.h - CH.b}" style="stroke:var(--axis)" stroke-dasharray="3 3" visibility="hidden"/></svg>
    <div class="ctot"><span>Period revenue <b class="num">${qar(tot("revenue"))}</b></span><span>Gross profit <b class="num">${qar(tot("gross_profit"))}</b></span></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function bindChart(rows) {
  const svg = $("#chart"); if (!svg) return;
  const tip = $("#tip"), hair = $("#hair");
  svg.onmousemove = e => {
    const b = svg.getBoundingClientRect(), vx = (e.clientX - b.left) / b.width * CH.w;
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((vx - CH.l) / ((CH.w - CH.l - CH.r) / Math.max(1, rows.length - 1)))));
    const px = CH.l + i * (CH.w - CH.l - CH.r) / Math.max(1, rows.length - 1);
    hair.setAttribute("x1", px); hair.setAttribute("x2", px); hair.setAttribute("visibility", "visible");
    const r = rows[i];
    tip.innerHTML = `<b>${new Date(r.date).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"})}</b><br>Revenue ${qar(r.revenue)}<br>Gross profit ${qar(r.gross_profit)}${
      r.smooth ? `<br><span class="muted">7-day average: ${qar(r.rv)} / ${qar(r.gv)}</span>` : ""}`;
    tip.style.display = "block";
    const box = svg.parentNode, left = px / CH.w * b.width + box.offsetLeft;   /* svg elements have no offsetLeft */
    tip.style.left = Math.min(left + 12, box.offsetLeft + b.width - 230) + "px"; tip.style.top = (box.offsetTop + 10) + "px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); };
}

const STAGES = ["new", "qualified", "quote_sent", "negotiation", "won", "lost"];
const LOST = ["price", "stock", "competitor", "timing", "no_response"];
const SOURCES = {showroom_chat: "Ceramica Nova AI chat", shop: "Online shop", walk_in: "Walk-in", phone: "Phone", referral: "Referral"};
const winCls = p => p >= 60 ? "hi" : p >= 40 ? "mid" : "lo";
const winBar = w => w ? `<span class="win ${winCls(w.pct)}" title="Win chance, learned from this company's won and lost leads"><i><b style="width:${w.pct}%"></b></i>${w.pct}%</span>` : `<span class="muted small">-</span>`;
const winWhy = w => w && w.reasons.length ? `<ul class="why">${w.reasons.map(r => `<li><span class="${r.up ? "up" : "dn"}">${r.up ? "▲" : "▼"}</span> ${esc(r.text)}</li>`).join("")}</ul>` : "";
async function winCard() {
  const c = await api("/winchance");
  if (!c.ready) return `<div class="notice small">Win chance needs at least ${c.min_closed} won or lost leads to learn from. So far: ${num(c.closed)}.</div>`;
  const row = (title, m) => m ? `<div><b>${title}</b><div class="small" style="margin:4px 0">Learned from ${num(m.trained_on)} closed leads (${num(m.won)} won).
      Tested on leads it had not seen: the ones it called likely (60%+) bought <b>${m.check.likely_won ?? "-"}%</b> of the time,
      the unlikely ones (under 40%) <b>${m.check.unlikely_won ?? "-"}%</b>, against ${m.check.base_rate}% overall.</div>
      <div class="small muted">What it learned matters most:</div>${winWhy({reasons: m.top.slice(0, 4)})}</div>` : "";
  return `<div class="card"><div class="head"><h2 class="grow">How win chance works</h2>${c.demo ? `<span class="tag pending">Learned from demo data</span>` : ""}</div>
    <p class="small" style="margin:0 0 10px">A small machine-learning model (logistic regression) learns from this company's own won and lost leads which facts go with a sale.
    It updates by itself every time a lead is won or lost. It is a guide for who to call first, not a promise. Nothing is sent outside Nova Studio.</p>
    <div class="grid row2">${row("Before a quotation", c.early)}${row("After a quotation is sent", c.quoted)}</div></div>`;
}

  const page = +(p.page || 0), qs = new URLSearchParams({offset: page * 25, limit: 25});
  if (p.status) qs.set("status", p.status); if (p.q) qs.set("q", p.q);
  const r = await api("/orders?" + qs);
  const link = ch => "#/orders?" + new URLSearchParams(Object.fromEntries(Object.entries({...p, page: "", ...ch}).filter(([, v]) => v)));
  $("#view").innerHTML = topbar("Orders", "Online orders wait as pending until a salesperson confirms them") + `
    <div class="filters"><div class="chips"><a class="chip ${!p.status ? "on" : ""}" href="${link({status: ""})}">All</a>
      ${OSTAT.map(s => `<a class="chip ${p.status === s ? "on" : ""}" href="${link({status: s})}">${label(s)} ${num(r.status_counts[s] || 0)}</a>`).join("")}</div>
      <span style="flex:1"></span><form id="sf"><input id="sq" placeholder="Search O-number or customer" value="${esc(p.q || "")}"></form></div>
    <div class="card"><div class="tablewrap"><table><tr><th>Order</th><th>Customer</th><th>Delivery area</th><th>From</th><th>Status</th><th class="right">Total</th><th class="right">Placed</th></tr>
      ${r.items.map(o => `<tr class="click" onclick="location.hash='#/orders/${o.id}'"><td>${esc(o.number)}</td><td>${esc(o.customer)}<br><span class="muted small">${esc(o.phone || "")}</span></td>
        <td class="small">${esc(o.area || "")}</td><td class="small">${o.channel === "chat" ? "AI chat" : label(o.channel)}</td>
        <td><span class="tag ${o.status}">${label(o.status)}</span></td><td class="right num">${qar(o.total, 2)}</td><td class="right small">${date(o.created_at)}</td></tr>`).join("")}</table>
      ${r.items.length ? "" : `<div class="empty">No orders match.</div>`}</div>
      <div class="pager">${r.total ? `${page * 25 + 1}–${Math.min(r.total, page * 25 + 25)} of ${num(r.total)}` : ""}
        <a class="btn ghost sm" ${page ? `href="${link({page: page - 1 || ""})}"` : "style='opacity:.4;pointer-events:none'"}>Previous</a>
        <a class="btn ghost sm" ${(page + 1) * 25 < r.total ? `href="${link({page: page + 1})}"` : "style='opacity:.4;pointer-events:none'"}>Next</a></div></div>`;
  $("#sf").onsubmit = e => { e.preventDefault(); location.hash = link({q: $("#sq").value.trim()}); };
}

async function orderView(id) {
  shell("orders", loading());
  const o = await api("/orders/" + id);
  const blocked = o.status === "pending" && o.lines.some(l => !l.one_batch_ok);
  S.titles[location.hash] = "Order " + o.number;
  $("#view").innerHTML = backLink("#/orders") +
    topbar(`Order ${esc(o.number)}`, `${o.lead_id && canLeads() ? `<a class="lnk" href="#/leads/${o.lead_id}">${esc(o.customer)} · lead ${esc(o.lead)}</a>` : esc(o.customer)}${
      o.quote_id && canQuotes() ? ` · <a class="lnk" href="#/quotes/${o.quote_id}">quotation ${esc(o.quote)}</a>` : ""} · ${esc(o.phone || "")} · ${esc(o.area || "")} · placed ${dateTime(o.created_at)}`,
      `<span class="tag ${o.status}">${label(o.status)}</span>`) + `
    <div class="card"><div class="head"><h2 class="grow">Items and batches</h2><div class="actions">
      ${o.can.confirm ? `<button class="btn ok sm" id="bConf" ${blocked ? "disabled title='No single batch covers every line'" : ""}>Confirm order</button>` : ""}
      ${o.can.deliver ? `<button class="btn sm" id="bDel">Mark delivered</button>` : ""}
      ${o.can.cancel ? `<button class="btn danger sm" id="bCan">Cancel</button>` : ""}</div></div>
      ${o.status === "pending" ? `<div class="notice ${blocked ? "bad" : ""} small" style="margin-bottom:12px">${blocked
        ? "At least one line can't be supplied from a single batch. Receive a new batch or change the quantity before confirming, so the customer gets one shade."
        : "Call the customer to confirm delivery and payment, then confirm. Stock is taken from the batch shown on each line."}</div>` : ""}
      <div class="tablewrap"><table><tr><th>Product</th><th class="right">Quantity</th><th class="right">Line total</th><th>${o.status === "pending" ? "Batch to use" : "Batch"}</th><th>Shade</th></tr>
        ${o.lines.map(l => `<tr><td>${esc(l.name)}<br><span class="muted small">${esc(l.sku)}</span></td><td class="right">${num(l.quantity, 2)} ${l.unit === "m2" ? "m²" : "sets"}</td>
          <td class="right num">${qar(l.line_total, 2)}</td>
          <td>${l.batch ? esc(l.batch) + (o.status === "pending" ? `<br><span class="muted small">${num(l.batch_left, 2)} left in batch</span>` : "") : `<span class="tag out">no single batch</span>`}</td>
          <td>${esc(l.shade || "-")}</td></tr>`).join("")}
        <tr><td colspan="2" class="right"><b>Total</b></td><td class="right num"><b>${qar(o.total, 2)}</b></td><td colspan="2"></td></tr></table></div>
      ${o.delivered_at ? `<p class="muted small">Delivered ${dateTime(o.delivered_at)}</p>` : ""}</div>
    ${o.shop ? `<div class="card"><div class="head"><h2 class="grow">Delivery and payment</h2>
      <span class="tag ${o.shop.payment_status === "paid" ? "ok" : o.shop.payment_status === "failed" ? "out" : "pending"}">${
        o.shop.payment_status === "paid" ? "Paid by card" : o.shop.payment_method === "on_delivery" ? "Pays on delivery"
        : o.shop.payment_status === "failed" ? "Card payment failed" : "Card payment not finished"}</span></div>
      <div class="kv"><span>Deliver to</span><span>${esc(o.shop.address)}</span>
        <span>Delivery day</span><span>${o.shop.delivery_date ? date(o.shop.delivery_date) : "-"}</span>
        <span>Amount</span><span>${qar(o.shop.amount_due, 2)}${o.shop.delivery_fee ? ` (incl. ${qar(o.shop.delivery_fee, 2)} delivery)` : " (free delivery)"}</span>
        ${o.shop.payment_status === "paid" ? `<span>Paid</span><span>${esc(o.shop.card || "Card")} · ${dateTime(o.shop.paid_at)}<br><span class="muted small">Tap ${esc(o.shop.reference || "")}</span></span>` : ""}</div></div>` : ""}`;
  if ($("#bConf")) $("#bConf").onclick = () => act(() => api(`/orders/${id}/confirm`, {method: "POST"}), "Order confirmed, stock taken");
  if ($("#bDel")) $("#bDel").onclick = () => act(() => api(`/orders/${id}/deliver`, {method: "POST"}), "Marked delivered");
  if ($("#bCan")) $("#bCan").onclick = async () => {
    const v = await ask("Cancel order", [{name: "reason", label: "Why?", type: "textarea", required: true}], "Cancel order",
      o.status === "confirmed" ? "The stock goes back into the same batches." : "");
    if (v) act(() => api(`/orders/${id}/cancel`, {method: "POST", body: v}), "Order cancelled");
  };
}

  const r = await api("/inventory");
  const show = r.items.filter(s => !p.status || s.status === p.status);
  const counts = r.items.reduce((a, s) => (a[s.status] = (a[s.status] || 0) + 1, a), {});
  $("#view").innerHTML = topbar("Inventory", "Stock by batch. Days left = stock ÷ average sold per day over the last 30 days",
      r.can.receive ? `<div class="actions"><button class="btn sm" id="invAdd">+ Add stock</button></div>` : "") + `

    <div class="card"><div class="tablewrap"><table><tr><th>Product</th><th class="right">Price</th><th class="right">In stock</th><th class="right">Largest batch</th><th class="right">Batches</th><th class="right">Sold / day</th><th class="right">Days left</th><th>Status</th></tr>

        <div>${esc(s.name)}<br><span class="muted small">${esc(s.sku)}</span></div></div></td>
        <td class="right num">${qar(s.price, 2)}<span class="muted small">/${s.unit === "m2" ? "m²" : "set"}</span></td>

/* Receive a delivery: pick the product (or it is given), quantity, shade and batch code. */
async function receiveDialog(items, sku = null) {
  const one = sku ? items.find(s => s.sku === sku) : null;
  const unitName = s => s && s.unit === "m2" ? "m²" : "sets";
  const r = await ask(one ? `Receive ${one.name}` : "Add stock", [
    ...(one ? [] : [{name: "sku", label: "Product", type: "select", required: true,
      options: [["", "Choose a product"], ...items.slice().sort((a, b) => a.name.localeCompare(b.name)).map(s => [s.sku, `${s.name} (${s.sku}) · ${num(s.stock, 1)} ${unitName(s)} now`])]}]),
    {name: "qty", label: one ? `Quantity received (${unitName(one)})` : "Quantity received (m² for tiles, sets for bathroom sets)", type: "number", min: 0.01, max: 100000, required: true},
    {name: "shade", label: "Shade", hint: "As printed on the boxes, e.g. Warm A2"},
    {name: "code", label: "Batch code", hint: "Left empty, one is made for you"},
  ], "Receive", "A delivery becomes a new batch, because tiles from different production runs can differ in shade. It is added to the stock straight away.",
  v => api(`/inventory/${encodeURIComponent(one ? one.sku : v.sku)}/receive`, {method: "POST", body: {qty: +v.qty, shade: v.shade || null, code: v.code || null}}));
  if (r) { toast(`Received ${num(r.qty, 1)} as batch ${r.code}.`); route(); }
}
async function choicesCard() {
  let c; try { c = await api("/choices"); } catch (e) { return ""; }
  if (!c.rooms.length) return "";
  return `<div class="card"><div class="head"><h2 class="grow">What customers choose</h2>${c.demo ? `<span class="tag pending">Learned from demo data</span>` : ""}</div>
    <p class="small" style="margin:0 0 10px">Counted from this company's quotations (a won order counts double) and from tiles visitors added to their project in the room visualiser
    (${num(c.events)} so far, half weight). Ceramica Nova AI uses it as a small bonus when it suggests tiles: safety rules, style, budget and stock still come first.</p>
    <div class="grid row2"><div class="tablewrap"><table><tr><th>Room</th><th>Chosen most</th></tr>
      ${c.rooms.map(r => `<tr><td class="nowrap">${esc(label(r.room))}<br><span class="muted small">${num(r.projects)} quotations${r.enough ? "" : " · too few to use"}</span></td>
        <td class="small">${r.top.map(t => `${esc(t.name)} <span class="muted">(in ${num(t.chosen)} quotes${t.bought ? `, ${num(t.bought)} bought` : ""}${t.liked ? `, ${num(t.liked)} added in the visualiser` : ""})</span>`).join("<br>")}</td></tr>`).join("")}</table></div>
    <div><b class="small">Often chosen together</b>${c.pairs.length ? `<ul class="why">${c.pairs.map(p => `<li>${esc(p.a)} + ${esc(p.b)} <span class="muted">· ${num(p.together)} times, ${p.lift}× more than chance</span></li>`).join("")}</ul>` : `<div class="muted small">Not enough yet.</div>`}</div></div></div>`;
}

  S.titles[location.hash] = p.name;
  $("#view").innerHTML = backLink("#/inventory") +
    topbar(esc(p.name), `${esc(p.sku)} · ${qar(p.price, 2)} per ${p.unit === "m2" ? "m²" : "set"}${p.cost_price != null ? " · cost " + qar(p.cost_price, 2) : ""}`,
      `<div class="actions">${inv.can.receive ? `<button class="btn sm" id="bRec">Receive new batch</button>${p.batches.length ? `<button class="btn ghost sm" id="bFix">Correct a quantity</button>` : ""}<button class="btn ghost sm" id="bReo">Reorder point</button>` : ""}
       ${inv.can.price ? `<button class="btn ghost sm" id="bPrice">Change price</button>` : ""}</div>`) + `
    <div class="grid kpis">
      <div class="card kpi"><div class="label">In stock</div><div class="value">${num(lv.stock, 1)} ${u}</div></div>
      <div class="card kpi"><div class="label">Largest single batch<span class="info" title="The most one customer can get in one shade">i</span></div><div class="value">${num(lv.largest_batch, 1)} ${u}</div></div>
      <div class="card kpi"><div class="label">Sold per day</div><div class="value">${num(lv.sold_per_day, 1)}</div><span class="muted small">last 30 days</span></div>
      <div class="card kpi"><div class="label">Days left</div><div class="value">${lv.days_of_stock != null ? num(lv.days_of_stock) : "-"}</div><span class="tag ${lv.status}">${label(lv.status)}</span></div>
      <div class="card kpi"><div class="label">Reorder point</div><div class="value">${num(lv.reorder_point)} ${u}</div></div></div>
    <div class="grid row2e" style="margin-top:14px">
      <div class="card"><div class="head"><h2>Batches</h2></div><div class="tablewrap"><table><tr><th>Batch</th><th>Shade</th><th class="right">Received</th><th class="right">Left</th><th class="right">Date</th></tr>
        ${p.batches.map(b => `<tr><td>${esc(b.code)}</td><td>${esc(b.shade || "-")}</td><td class="right">${num(b.received, 1)}</td>
          <td class="right"><b>${num(b.left, 1)}</b><div class="meter"><i style="width:${b.received ? b.left / b.received * 100 : 0}%;background:var(--accent)"></i></div></td>
          <td class="right small">${date(b.received_at)}</td></tr>`).join("")}</table></div>
        <p class="muted small" style="margin:10px 0 0">Tiles from different production runs can differ in shade, so each order line is supplied from one batch.</p></div>
      <div class="card"><div class="head"><h2>Stock movements</h2></div><div class="tablewrap"><table><tr><th>Date</th><th>What</th><th>Batch</th><th class="right">Qty</th></tr>
        ${p.movements.map(m => `<tr><td class="small">${dateTime(m.at)}</td><td class="small">${label(m.reason)} <span class="muted">${esc(m.reference || "")}</span>${m.by ? `<br><span class="muted">${esc(m.by)}</span>` : ""}</td>
          <td class="small">${esc(m.batch || "")}</td><td class="right num ${m.qty < 0 ? "delta down" : "delta up"}">${m.qty > 0 ? "+" : ""}${num(m.qty, 2)}</td></tr>`).join("")}</table></div></div></div>`;
  if ($("#bRec")) $("#bRec").onclick = () => receiveDialog(inv.items, sku);
  if ($("#bFix")) $("#bFix").onclick = async () => {
    const r = await ask(`Correct a quantity: ${p.name}`, [
      {name: "batch", label: "Batch", type: "select", required: true, value: p.batches.length === 1 ? p.batches[0].code : "",
       options: [["", "Choose a batch"], ...p.batches.map(b => [b.code, `${b.code}${b.shade ? " · " + b.shade : ""} · ${num(b.left, 2)} ${u} left now`])]},
      {name: "counted", label: `Quantity really left (${u})`, type: "number", min: 0, max: 100000, required: true,
       check: (v, all) => { const b = p.batches.find(x => x.code === all.batch); return b && +v === b.left ? `That is already the quantity of ${b.code}.` : ""; }},
      {name: "reason", label: "Why", type: "select", required: true, options: [["", "Choose a reason"], ["count", "Stock count (the shelf has a different amount)"],
        ["damaged", "Damaged or broken"], ["returned", "Returned by a customer"], ["found", "Found in the store"], ["other", "Other"]]},
      {name: "note", label: "Note", type: "textarea", max: 200, hint: "e.g. 3 boxes broken when unloading"},

    v => api(`/inventory/${encodeURIComponent(sku)}/adjust`, {method: "POST", body: {batch: v.batch, counted: +v.counted, reason: v.reason, note: v.note || null}}));
    if (r) { toast(`Batch ${r.code} now has ${num(r.left, 2)} ${u}.`); route(); }
  };
  if ($("#bReo")) $("#bReo").onclick = async () => {

      v => api(`/inventory/${encodeURIComponent(sku)}/reorder`, {method: "POST", body: {reorder_point: +v.reorder_point}}));
    if (r) { toast("Reorder point saved."); route(); }
  };
  if ($("#bPrice")) $("#bPrice").onclick = async () => {
    const v = await ask("Change price", [{name: "price", label: "Selling price (QAR)", type: "number", value: p.price, min: 0.01, required: true},
      {name: "cost_price", label: "Cost price (QAR)", type: "number", value: p.cost_price, min: 0.01, required: true}], "Save",
      "The shop and Ceramica Nova AI use the new price straight away. Quotations already sent keep their price. The change is kept in the audit log.");
    if (v) act(() => api(`/products/${encodeURIComponent(sku)}/price`, {method: "POST", body: {price: +v.price, cost_price: +v.cost_price}}), "Price updated");
  };
}

  shell("approvals", topbar("Discount approvals", `Minimum gross margin ${r.min_margin_pct}%. Below it, only the owner can approve, with a reason.`) + `
    ${r.pending.length ? `<div class="grid copilot">${r.pending.map(a => { const low = a.margin_after_pct < r.min_margin_pct; return `
      <div class="cc"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:18px">${a.percent}%</b><span class="muted small">on</span>
        <a href="#/quotes/${a.quote_id}"><b>${esc(a.quote)}</b></a><span style="flex:1"></span><span class="tag ${low ? "out" : "ok"}">margin ${a.margin_after_pct}%</span></div>
        <span class="small">${esc(a.customer)}${a.lead ? ` · <a class="muted" href="#/leads/${a.lead_id}">${esc(a.lead)}</a>` : ""}</span>
        <span class="small">${qar(a.subtotal, 2)} → <b>${qar(a.total_after, 2)}</b></span>
        <span class="small"><b>Why it's waiting:</b> ${esc(a.why)}</span>
        <span class="why">Asked by ${esc(a.requested_by)} · ${dateTime(a.created_at)}${a.reason && !a.reason.includes("Needs approval") ? "<br>Note: " + esc(a.reason) : ""}</span>
        <div class="actions"><button class="btn ok sm" data-ok="${a.id}" data-low="${low ? 1 : ""}" ${low && !r.is_owner ? "disabled title='Below the minimum margin: only the owner can approve'" : ""}>Approve</button>
          <button class="btn danger sm" data-no="${a.id}">Reject</button></div></div>`; }).join("")}</div>`
      : `<div class="card"><div class="empty">No discounts waiting. Discounts within a salesperson's limit and the minimum margin are applied automatically.</div></div>`}
    <div class="card" style="margin-top:14px"><div class="head"><h2>Last 30 days</h2></div><div class="tablewrap"><table>
      <tr><th>Quote</th><th class="right">Discount</th><th class="right">Margin after</th><th>Decision</th><th>Asked by</th><th>Decided by</th><th>Reason</th><th class="right">When</th></tr>
      ${r.history.map(h => `<tr class="click" onclick="location.hash='#/quotes/${h.quote_id}'"><td>${esc(h.quote)}</td><td class="right">${h.percent}%</td><td class="right">${h.margin_after_pct}%</td>
        <td><span class="tag ${h.status}">${label(h.status)}</span></td><td class="small">${esc(h.requested_by)}</td><td class="small">${esc(h.decided_by || (h.status === "auto_approved" ? "Automatic" : ""))}</td>
        <td class="small muted">${esc(h.reason || "")}</td><td class="right small">${date(h.at)}</td></tr>`).join("")}</table></div></div>`);
  bindDecisions();
}

/* Approve / reject buttons (Approvals page and the quotation page). data-ok / data-no = request id. */
function bindDecisions() {
  const done = () => r => { if (r !== undefined) S.pending = Math.max(0, (S.pending || 1) - 1); return r; };
  document.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    let body = {decision: "approve"};
    if (b.dataset.low) {
      const v = await ask("Approve below the minimum margin?", [{name: "reason", label: "Reason (kept in the audit log)", type: "textarea", required: true},
        {name: "override", type: "checkbox", label: "Override", hint: "I accept the lower margin on this quotation"}], "Approve");
      if (!v) return; body = {...body, ...v};
    }
    act(() => api(`/approvals/${b.dataset.ok}`, {method: "POST", body}).then(done()), "Approved and applied to the quotation");
  });
  document.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => {
    const v = await ask("Reject discount", [{name: "reason", label: "Reason for the salesperson", type: "textarea", required: true}], "Reject");
    if (v) act(() => api(`/approvals/${b.dataset.no}`, {method: "POST", body: {decision: "reject", reason: v.reason}}).then(done()), "Rejected");
  });
}

const TOOL_NAMES = {get_kpis: "Key figures", sales_breakdown: "Sales breakdown", leads_breakdown: "Leads breakdown",
  top_products: "Top products", stock: "Stock levels", waiting_quotes: "Quotations waiting", pipeline: "Pipeline"};
S.asks = [];
function dataTable(out) {
  const list = Object.values(out).find(v => Array.isArray(v) && v.length && typeof v[0] === "object");
  const scal = Object.entries(out).filter(([, v]) => v !== null && typeof v !== "object");
  const cell = v => typeof v === "number" ? num(v, 2) : esc(v ?? "-");
  return (scal.length ? `<div class="kv" style="margin:6px 0">${scal.map(([k, v]) => `<span>${esc(label(k))}</span><span>${cell(v)}</span>`).join("")}</div>` : "")
    + (out.change ? `<div class="kv" style="margin:6px 0">${Object.entries(out.change).map(([k, v]) => `<span>Change: ${esc(label(k))}</span><span>${v == null ? "-" : v + (k.endsWith("pp") ? " pts" : "%")}</span>`).join("")}</div>` : "")
    + (list ? `<div class="tablewrap"><table><tr>${Object.keys(list[0]).map(k => `<th>${esc(label(k))}</th>`).join("")}</tr>
        ${list.map(r => `<tr>${Object.values(r).map(v => `<td>${typeof v === "object" && v ? esc(JSON.stringify(v)) : cell(v)}</td>`).join("")}</tr>`).join("")}</table></div>` : "");
}

function showDraft(d) {
  const wa = d.channel === "whatsapp", tag = d.mode === "claude" ? `<span class="ai-tag">AI draft · Claude · check before sending</span>` : `<span class="ai-tag off">Standard template</span>`;
  $("#editor").innerHTML = `<div class="card" style="margin-bottom:14px"><div class="head"><h2 class="grow">${wa ? "WhatsApp" : "Email"} to ${esc(d.customer)} · ${esc(d.quote)}</h2>${tag}</div>
    ${d.note ? `<div class="notice warn small" style="margin-bottom:10px">${esc(d.note)}</div>` : ""}
    <textarea class="draft" id="dt">${esc(d.text)}</textarea>
    <div class="actions" style="margin-top:10px">
      ${wa ? (d.whatsapp_number ? `<a class="btn ghost sm" id="open" target="_blank" rel="noopener">Open in WhatsApp</a>` : `<span class="muted small">No phone number on file.</span>`)
           : (d.email ? `<a class="btn ghost sm" id="open">Open in email app</a>` : `<span class="muted small">No email on file.</span>`)}

    const m = t.match(/^Subject:\s*(.*)\n+/); return `mailto:${d.email}?subject=${encodeURIComponent(m ? m[1] : "Your quotation " + d.quote)}&body=${encodeURIComponent(m ? t.slice(m[0].length) : t)}`; };
  if ($("#open")) { $("#open").href = link(); $("#dt").oninput = () => $("#open").href = link(); }
  $("#copy").onclick = () => { navigator.clipboard?.writeText($("#dt").value).then(() => toast("Copied"), () => toast("Couldn't copy", "bad")); };
  $("#close").onclick = () => $("#editor").innerHTML = "";
  $("#sent").onclick = () => act(() => api(`/followups/${d.quote_id}/sent`, {method: "POST", body: {channel: d.channel, text: $("#dt").value}}),

}

    const name = $("#srName").value.trim(), file = $("#srFile").files[0];
    err("srName", name.length < 2 ? "Give the room a name (at least 2 letters)." : "");
    err("srFile", !file ? "Choose a photo." : file.size > 12e6 ? "That photo is larger than 12 MB." : "");
    if (name.length < 2 || !file || file.size > 12e6) return;
    const btn = $("#srAdd"); btn.disabled = true; btn.textContent = "Uploading…";
    try {
      const r = await fetch(`/api/admin/rooms?name=${encodeURIComponent(name)}&location=${$("#srLoc").value}`, {method: "POST",
        headers: {"Content-Type": file.type || "image/jpeg", Authorization: "Bearer " + S.token}, body: file});
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof out.detail === "string" ? out.detail : "The photo could not be uploaded.");
      toast("Uploaded. The room AI is marking it now.");
    } catch (x) { toast(x.message, "bad"); }
    sampleRoomsView();
  };
  document.querySelectorAll("[data-pub]").forEach(b => b.onclick = () => act(() => api(`/rooms/${b.dataset.pub}`,
    {method: "PATCH", body: {published: b.dataset.on === "1"}}), b.dataset.on === "1" ? "Published. Customers now see it." : "Taken out of the shop."));
  document.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => act(() => api(`/rooms/${b.dataset.retry}/analyse`, {method: "POST"}), "Started again."));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const ok = await ask(`Delete “${b.dataset.name}”?`, [], "Delete", "The photo and your fixes are removed, and customers no longer see this room.");
    if (ok) act(() => api(`/rooms/${b.dataset.del}`, {method: "DELETE"}), "Deleted.");
  });
  if ($("#srZip")) $("#srZip").onclick = async () => {
    const r = await fetch("/api/admin/roomai/training.zip", {headers: {Authorization: "Bearer " + S.token}});
    if (!r.ok) return toast("Could not download the fixes.", "bad");
    const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(await r.blob()), download: "room-ai-fixes.zip"});
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  if (d.rooms.some(r => r.status === "analysing")) setTimeout(() => { if (location.hash === "#/samplerooms") sampleRoomsView(); }, 8000);
}

/* Check & fix one room: green = floor, blue = walls, as the shop will tile them. Paint or tap to add or remove. */
async function sampleRoomView(id) {
  shell("samplerooms", topbar("Sample room") + loading());
  const d = await api(`/rooms/${id}`);
  if (!d.room) throw new Error("This room has not been marked by the room AI yet.");
  const room = d.room, W = Math.round(d.width / 2), H = Math.round(d.height / 2);
  S.titles["#/samplerooms/" + id] = d.name;
  const load = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
  const mk = async url => { const c = Object.assign(document.createElement("canvas"), {width: W, height: H}); if (url) c.getContext("2d").drawImage(await load(url), 0, 0, W, H); return c; };
  const ed = room.baseEdits || {};
  const E = {remove: await mk(ed.remove), add: {floor: await mk((ed.add || {}).floor), wall: await mk((ed.add || {}).wall)}};
  const masks = {floor: [], wall: []};
  for (const [k, list] of Object.entries(room.surfaces)) for (const s of list) masks[k].push(await load(s.mask));
  let surf = "floor", tool = "add", size = 18, dirty = false, busy = false;
  $("#view").innerHTML = topbar(d.name, "Check what the room AI marked, then fix it", `<a class="btn ghost" href="#/samplerooms">Back to sample rooms</a>`) + `
    <div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <div class="sr-legend"><span><i style="background:#2ecc71"></i>Floor</span><span><i style="background:#3498db"></i>Walls</span><span class="muted">No colour = not tiled</span></div>
      <div class="seg" id="srSurf"><button data-v="floor" class="on">Floor</button><button data-v="wall">Wall</button></div>
      <div class="seg" id="srTool"><button data-v="add" class="on">Add</button><button data-v="erase">Erase</button></div>
      <div class="seg" id="srSize"><button data-v="8">S</button><button data-v="18" class="on">M</button><button data-v="36">L</button>
        ${d.room_ai === false ? "" : `<button data-v="smart" title="Tap once: the room AI picks the whole area or object">✨ Tap</button>`}</div>
      <button class="btn" id="srSave" disabled>Save fixes</button><button class="btn ghost sm" id="srClear">Clear my fixes</button></div>
      <div class="small muted" id="srHint" style="margin-bottom:8px">Paint with the mouse, or pick ✨ Tap and click once on an area: the room AI finds its whole outline.</div>
      <div class="sr-stage" id="srStage"><img id="srImg" src="${esc(room.photo)}" alt=""><canvas id="srCv" width="${W}" height="${H}"></canvas></div>
      <div class="actions" style="margin-top:12px">${d.published ? `<a class="btn ghost" href="/assistant#/rooms" target="_blank">See it in the shop</a>`
        : `<button class="btn" id="srPub">Publish to the shop</button>`}</div></div>`;
  const cv = $("#srCv"), ctx = cv.getContext("2d");
  const layer = (kind, col) => {
    const t = Object.assign(document.createElement("canvas"), {width: W, height: H}), x = t.getContext("2d");
    for (const m of masks[kind]) x.drawImage(m, 0, 0, W, H);
    x.drawImage(E.add[kind], 0, 0);
    x.globalCompositeOperation = "destination-out"; x.drawImage(E.remove, 0, 0);
    x.globalCompositeOperation = "source-in"; x.fillStyle = col; x.fillRect(0, 0, W, H);
    return t;
  };
  const paint = () => { ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 0.45; ctx.drawImage(layer("floor", "#2ecc71"), 0, 0); ctx.drawImage(layer("wall", "#3498db"), 0, 0); ctx.globalAlpha = 1; };
  paint();
  const changed = () => { dirty = true; $("#srSave").disabled = false; paint(); };
  const seg = (id, fn) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset.v); });
  seg("srSurf", v => surf = v); seg("srTool", v => tool = v); seg("srSize", v => size = v === "smart" ? v : +v);
  const at = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H, (size === "smart" ? 0 : size) * W / b.width]; };
  const layers = () => tool === "erase" ? [E.remove, E.add[surf]] : [E.add[surf], E.remove];
  let down = false, last = null;
  const dab = e => {
    const [x, y, r] = at(e);
    for (const [c, op] of [[layers()[0], "source-over"], [layers()[1], "destination-out"]]) {
      const g = c.getContext("2d"); g.globalCompositeOperation = op; g.strokeStyle = g.fillStyle = "#fff"; g.lineWidth = r * 2; g.lineCap = "round";
      g.beginPath(); if (last) { g.moveTo(last[0], last[1]); g.lineTo(x, y); g.stroke(); } else { g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
      g.globalCompositeOperation = "source-over";
    }
    last = [x, y]; changed();
  };
  cv.addEventListener("pointerdown", async e => {
    if (size !== "smart") { down = true; last = null; cv.setPointerCapture(e.pointerId); dab(e); return; }
    if (busy) return;
    const [x, y] = at(e); busy = true; $("#srHint").textContent = "The room AI is finding that area… (a few seconds)";
    try {
      const t = await api(`/rooms/${id}/tap`, {method: "POST", body: {points: [[x * 2, y * 2, 1]]}});
      if (t.share > 0.6) throw new Error("That picked almost the whole photo. Click closer to the spot, or use the brush.");
      const im = await load(t.mask);
      for (const [c, op] of [[layers()[0], "source-over"], [layers()[1], "destination-out"]]) {
        const g = c.getContext("2d"); g.globalCompositeOperation = op; g.drawImage(im, 0, 0, W, H); g.globalCompositeOperation = "source-over";
      }
      changed();
    } catch (x) { toast(x.message, "bad"); }
    busy = false; $("#srHint").textContent = "Paint with the mouse, or pick ✨ Tap and click once on an area: the room AI finds its whole outline.";
  });
  cv.addEventListener("pointermove", e => { if (down) dab(e); });
  cv.addEventListener("pointerup", () => { down = false; last = null; });
  const ink = c => { const p = c.getContext("2d").getImageData(0, 0, W, H).data; for (let i = 3; i < p.length; i += 64) if (p[i]) return true; return false; };
  $("#srSave").onclick = async () => {
    const add = {}; for (const k of ["floor", "wall"]) if (ink(E.add[k])) add[k] = E.add[k].toDataURL("image/png");
    const remove = ink(E.remove) ? E.remove.toDataURL("image/png") : null;
    try {
      await api(`/rooms/${id}`, {method: "PATCH", body: (remove || Object.keys(add).length) ? {edits: {remove, add}} : {clear_edits: true}});
      dirty = false; $("#srSave").disabled = true; toast(d.published ? "Saved. Customers see the fixed room now." : "Saved.");
    } catch (x) { toast(x.message, "bad"); }
  };
  $("#srClear").onclick = () => { for (const c of [E.remove, E.add.floor, E.add.wall]) c.getContext("2d").clearRect(0, 0, W, H); changed(); };
  if ($("#srPub")) $("#srPub").onclick = async () => {
    if (dirty) await $("#srSave").onclick();
    act(() => api(`/rooms/${id}`, {method: "PATCH", body: {published: true}}), "Published. Customers now see it.");
  };
}
/* ------------------------------------------------------------------ router */
/* Back = where you actually came from inside the admin (keeps list filters and page);
   opened directly from a link or bookmark, Back goes to that section's list. */
const SECTION = {ask: "Ask your data", followups: "Follow-ups", dashboard: "Dashboard", leads: "Leads", quotes: "Quotations", orders: "Orders", inventory: "Inventory",
                 approvals: "Approvals", audit: "Audit log", team: "Staff accounts", rooms3d: "3D rooms", samplerooms: "Sample rooms", settings: "Settings"};
function titleOf(hash) {
  if (S.titles[hash]) return S.titles[hash];
  const sec = hash.slice(2).split(/[/?]/)[0];
  return SECTION[sec] || "Back";
}
function backLink(fallback) {
  const prev = S.trail[S.trail.length - 2];
  return `<a class="back" href="${prev || fallback}" onclick="return goBack('${fallback}')">${icon("back")} ${esc(titleOf(prev || fallback))}</a>`;
}
function goBack(fallback) {
  if (S.trail.length > 1) history.back(); else location.hash = fallback;
  return false;
}
const canLeads = () => S.can.has("leads.view_all") || S.can.has("leads.view_own");
const canQuotes = () => S.can.has("quotes.view_all") || S.can.has("quotes.view_own");

async function route() {
  if (!S.me) return;
  const [path, query] = (location.hash.slice(2) || "").split("?");
  const parts = path.split("/"), p = Object.fromEntries(new URLSearchParams(query || ""));
  const home = S.can.has("dashboard.view") ? "dashboard" : "inventory";
  const allowed = new Set(modules().map(m => m[0]));
  const view = allowed.has(parts[0]) ? parts[0] : null;
  if (!view) { location.replace("#/" + home); return; }
  const h = location.hash;
  if (S.trail[S.trail.length - 2] === h) S.trail.pop();
  else if (S.trail[S.trail.length - 1] !== h) S.trail.push(h);
  try {
    if (view === "dashboard") await dashboardView();
    else if (view === "leads") await (parts[1] ? leadView(+parts[1]) : leadsView(p));
    else if (view === "quotes") await (parts[1] ? quoteView(+parts[1]) : quotesView(p));
    else if (view === "orders") await (parts[1] ? orderView(+parts[1]) : ordersView(p));
    else if (view === "inventory") await (parts[1] ? productView(decodeURIComponent(parts[1])) : inventoryView(p));
    else if (view === "approvals") await approvalsView();
    else if (view === "ask") await askView();
    else if (view === "followups") await followupsView();
    else if (view === "audit") await auditView();
    else if (view === "team") await teamView();
    else if (view === "settings") await settingsView();
    else if (view === "rooms3d") await rooms3dView();
    else if (view === "samplerooms") await (parts[1] ? sampleRoomView(parts[1]) : sampleRoomsView());
    window.scrollTo(0, 0);
  } catch (e) {
    if (!S.token) return;
    const v = $("#view") || $("#root");
    v.innerHTML = topbar("Couldn't load this page") + `<div class="notice bad">${esc(e.message)}</div>`;
  }
}

async function boot() {
  if (!S.token) return loginView();
  try {
    S.me = await api("/me");
    S.can = new Set(S.me.permissions);
    S.pending = 0;
    if (S.can.has("discounts.approve")) api("/approvals").then(r => { S.pending = r.pending.length;
      const a = document.querySelector('nav a[href="#/approvals"]'); if (a && S.pending && !a.querySelector(".count")) a.insertAdjacentHTML("beforeend", `<span class="count">${S.pending}</span>`); }).catch(() => {});
    route();
  } catch (e) { loginView(); }
}
window.addEventListener("hashchange", route);
boot();
</script>
